name: Ibero — Build & Publish

on:
  push:
    branches: ["ibero/**"]

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: tags
        run: |
          SHA_SHORT=$(git rev-parse --short HEAD)
          BRANCH="${GITHUB_REF_NAME//\//-}"
          REPO_LC=$(echo "${{ github.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "sha=${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "image=ghcr.io/${REPO_LC}" >> $GITHUB_OUTPUT
          echo "tag_sha=${BRANCH}-${SHA_SHORT}" >> $GITHUB_OUTPUT
          echo "tag_latest=${BRANCH}-latest" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.tag_sha }}
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.tag_latest }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_WEBAPP_URL=https://cal.ibero.work
